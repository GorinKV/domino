<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Домино</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>🁫 Домино</h1>
<div class="top-bar">
<span>Раунд <span class="round" id="round">1</span></span>
<span>Счёт: <span id="score">0 : 0</span></span>
</div>
<div class="board-wrap" id="boardWrap">
<div class="board" id="board"></div>
</div>
<div class="status" id="status">Ваш ход</div>
<div class="ai-info" id="aiInfo">У ИИ: 7 · Базар: 14</div>
<div class="btn-row">
<button class="btn" id="btnBazaar">Взять из базара</button>
<button class="btn" id="btnPass" style="display:none">Пропустить</button>
<button class="btn gold" id="btnNewGame" style="display:none">Новая игра</button>
</div>
<div class="hand" id="hand"></div>
<div class="toast" id="toast"></div>
<script src="game.js"></script>
</body>
</html>
